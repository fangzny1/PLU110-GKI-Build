name: Build PLU110 Turbo 6 (KSUN + DroidSpaces)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-plu110:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Minimal Dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils pigz
          sudo apt-get clean
          echo "✅ Dependencies installed"
          echo "::endgroup::"

      - name: Configure ccache (bounded)
        run: |
          echo "::group::Configure ccache environment"
          set -euo pipefail
          if command -v ccache >/dev/null 2>&1; then
            CACHE_DIR="${{ github.workspace }}/.ccache"
            CCACHE_LOG="${{ github.workspace }}/ccache.log"
            mkdir -p "$CACHE_DIR"
            SETTINGS=(
              "CCACHE_DIR=$CACHE_DIR"
              "CCACHE_MAXSIZE=12G"
              "CCACHE_COMPILERCHECK=content"
              "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
              "CCACHE_NOHASHDIR=true"
              "CCACHE_IGNOREOPTIONS=--sysroot*"
              "CCACHE_COMPRESSION=true"
              "CCACHE_COMPRESSION_LEVEL=3"
              "CCACHE_DIRECT=true"
              "CCACHE_FILE_CLONE=true"
              "CCACHE_INODE_CACHE=true"
              "CCACHE_IS_KERNEL_COMPILING=true"
              "CCACHE_UMASK=002"
              "CCACHE_LOGFILE=${CCACHE_LOG}"
              "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
            )
            for setting in "${SETTINGS[@]}"; do
              export "$setting"
              echo "$setting" >> "$GITHUB_ENV"
            done
            if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
            fi
            echo "✅ ccache configured successfully"
            ccache -p | head -8
          else
            echo "ccache not found, skipping configuration."
          fi
          echo "::endgroup::"

      - name: Build kernel via WildKernels build-kernel action
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: |
            {
              "model": "OP-TURBO-6-6.6.89",
              "soc": "sm8735",
              "branch": "wild/sm8735",
              "manifest": "oneplus_turbo6_6.6.89_w.xml",
              "android_version": "android15",
              "kernel_version": "6.6",
              "os_version": "A16",
              "lto": "thin",
              "zyc_compiler": "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz",
              "c_compiler": "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin",
              "rust_compiler": "",
              "bindgen": "",
              "rust_build": false,
              "disk_cleanup": false,
              "hmbird": false,
              "susfs": false,
              "opt": true,
              "ds": true,
              "bbg": true,
              "bbr": true,
              "bbr3": true,
              "ttl": true,
              "ip_set": true,
              "unicode": true,
              "ntsync": false,
              "blacklist_modules": "kernelsu,oplus_security_guard,oplus_qr_scan,oplus_score,oplus_vip_task,oplus_dns_cache,oplus_network_linkpower_module,oplus_data_module,oplus_secure_harden,oplus_security_keventupload,oplus_secure_guard_new,oplus_secure_guard,coresight_tpda,coresight_tgu,coresight_trace_noc,coresight_cti,coresight_qmi,coresight_dummy,coresight_remote_etm,coresight_tpdm,coresight_uetm,coresight_stm,coresight_tmc_sec,f_fs_ipc_log,qcom_iommu_debug,qti_battery_debug,rdbg,stm_heartbeat,stm_p_ost,stm_core,stm_ftrace,stm_console,spmi_pmic_arb_debug",
              "uname": "TURBO6-WILD"
            }
          ksu_type: KSUN
          github_token: ${{ secrets.GITHUB_TOKEN }}